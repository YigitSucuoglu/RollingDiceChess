name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run validate:ci

  e2e:
    name: Chromium browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          if ! timeout --foreground --kill-after=30s 3m npx playwright install chromium; then
            echo "::error::Chromium installation did not complete within 3 minutes."
            exit 1
          fi

      - name: Build production application
        run: npm run build

      - name: Run Chromium regression tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cross-browser:
    name: Cross-browser beta qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install qualification browsers
        run: |
          if ! timeout --foreground --kill-after=30s 3m npx playwright install chromium firefox webkit; then
            echo "::error::Qualification browser installation did not complete within 3 minutes."
            exit 1
          fi

      - name: Build production application
        run: npm run build

      - name: Run cross-browser qualification
        run: npm run test:e2e:qualification

      - name: Upload qualification failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qualification-report
          path: |
            playwright-report/
            test-results/qualification/
          retention-days: 7
